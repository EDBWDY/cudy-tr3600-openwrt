name: Verify existing TR3600 firmware without recompiling
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Run ID that already uploaded produced firmware'
        required: true
      artifact_name:
        description: 'Exact unverified artifact name from that run'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install official extraction tool
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Validate verifier and source privacy
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/privacy_audit.py
          python3 -m unittest discover -s scripts -p 'test_image_extraction.py'
          python3 -m unittest discover -s scripts -p 'test_kernel_audit.py'
      - name: Download already compiled firmware and matching packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify existing firmware without compiling
        run: python3 scripts/audit_downloaded.py downloaded
      - name: Upload verified existing firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tr3600-verified-existing-${{ inputs.source_run }}
          path: verified-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
