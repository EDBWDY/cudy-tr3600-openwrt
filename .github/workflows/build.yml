name: TR3600 staged public firmware
on:
  workflow_dispatch:
    inputs:
      start_stage:
        description: Stage to start or resume (never skip an unfinished prerequisite)
        type: choice
        options: [tools, rust, firmware]
        default: tools
      resume_release:
        description: Exact encrypted checkpoint Release tag; empty only for a new tools build
        default: ''
        required: false
permissions:
  contents: write
concurrency:
  group: tr3600-public-firmware
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
jobs:
  tools:
    name: Tools and cross compiler
    if: inputs.start_stage == 'tools'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.tag }}
    steps:
      - name: Checkout reviewed public recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Linux compiler environment
        run: bash scripts/environment.sh
      - name: Reject private source state
        run: python3 scripts/public_source_audit.py
      - name: Restore authenticated compiler checkpoint
        if: inputs.resume_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_KEY: ${{ secrets.TR3600_CHECKPOINT_KEY_V1 }}
          RESUME_TAG: ${{ inputs.resume_release }}
        run: python3 scripts/release_checkpoint.py restore "$RESUME_TAG" tools
      - name: Prepare pinned public sources and package configuration
        if: inputs.resume_release == ''
        run: python3 -u scripts/prepare.py
      - name: Download checksum-pinned sources
        working-directory: openwrt
        run: timeout --kill-after=60s 45m make -j8 download V=s
      - name: Compile tools; preserve a nonzero or timed-out stage for same-stage continuation
        run: bash scripts/compile-stage.sh tools
      - name: Preserve complete or partial compiler state in encrypted Release chunks
        id: checkpoint
        if: always() && hashFiles('openwrt/.config') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_KEY: ${{ secrets.TR3600_CHECKPOINT_KEY_V1 }}
        run: |
          tag="checkpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-tools"
          python3 -u scripts/release_checkpoint.py save "$tag" tools
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Checkpoint: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep build log independently of feature tests
        if: always() && steps.checkpoint.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: ${{ steps.checkpoint.outputs.tag }}
        run: |
          mkdir -p diagnostics
          cp -f build-tools.log compile-tools.status diagnostics/ 2>/dev/null || true
          python3 scripts/release_outputs.py "$CHECKPOINT_TAG" diagnostics --reports
  rust:
    name: Rust and LLVM
    needs: tools
    if: always() && (needs.tools.result == 'success' || inputs.start_stage == 'rust')
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.tag }}
    steps:
      - name: Checkout reviewed public recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Linux compiler environment
        run: bash scripts/environment.sh
      - name: Reject private source state
        run: python3 scripts/public_source_audit.py
      - name: Restore authenticated compiler checkpoint

        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_KEY: ${{ secrets.TR3600_CHECKPOINT_KEY_V1 }}
          RESUME_TAG: ${{ needs.tools.outputs.checkpoint || inputs.resume_release }}
        run: python3 scripts/release_checkpoint.py restore "$RESUME_TAG" rust
      - name: Ensure the pinned host Rust archive exists
        run: python3 scripts/ensure-rust-source.py
      - name: Compile rust; preserve a nonzero or timed-out stage for same-stage continuation
        run: bash scripts/compile-stage.sh rust
      - name: Preserve complete or partial compiler state in encrypted Release chunks
        id: checkpoint
        if: always() && hashFiles('openwrt/.config') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_KEY: ${{ secrets.TR3600_CHECKPOINT_KEY_V1 }}
        run: |
          tag="checkpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-rust"
          python3 -u scripts/release_checkpoint.py save "$tag" rust
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Checkpoint: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep build log independently of feature tests
        if: always() && steps.checkpoint.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: ${{ steps.checkpoint.outputs.tag }}
        run: |
          mkdir -p diagnostics
          cp -f build-rust.log compile-rust.status diagnostics/ 2>/dev/null || true
          python3 scripts/release_outputs.py "$CHECKPOINT_TAG" diagnostics --reports
  firmware:
    name: Firmware compilation and preservation
    needs: rust
    if: always() && (needs.rust.result == 'success' || inputs.start_stage == 'firmware')
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.tag }}
      candidate: ${{ steps.preserve.outputs.release }}
    steps:
      - name: Checkout reviewed public recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Linux compiler environment
        run: bash scripts/environment.sh
      - name: Reject private source state
        run: python3 scripts/public_source_audit.py
      - name: Restore authenticated compiler checkpoint

        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_KEY: ${{ secrets.TR3600_CHECKPOINT_KEY_V1 }}
          RESUME_TAG: ${{ needs.rust.outputs.checkpoint || inputs.resume_release }}
        run: python3 scripts/release_checkpoint.py restore "$RESUME_TAG" firmware
      - name: Compile firmware; preserve a nonzero or timed-out stage for same-stage continuation
        run: bash scripts/compile-stage.sh firmware
      - name: Collect images and matching packages BEFORE independent tests
        if: always() && hashFiles('openwrt/.config') != ''
        run: python3 scripts/collect-unverified.py
      - name: Upload compiler output BEFORE checkpoint packing and tests
        id: preserve
        if: always() && hashFiles('unverified-artifacts/UNVERIFIED.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_outputs.py "candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" unverified-artifacts
      - name: Preserve complete or partial compiler state in encrypted Release chunks
        id: checkpoint
        if: always() && hashFiles('openwrt/.config') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_KEY: ${{ secrets.TR3600_CHECKPOINT_KEY_V1 }}
        run: |
          tag="checkpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-firmware"
          python3 -u scripts/release_checkpoint.py save "$tag" firmware
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Checkpoint: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep build log independently of feature tests
        if: always() && steps.checkpoint.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: ${{ steps.checkpoint.outputs.tag }}
        run: |
          mkdir -p diagnostics
          cp -f build-firmware.log compile-firmware.status diagnostics/ 2>/dev/null || true
          python3 scripts/release_outputs.py "$CHECKPOINT_TAG" diagnostics --reports
  validate:
    name: Independent validation of already preserved firmware
    needs: firmware
    if: always() && needs.firmware.outputs.candidate != '' && needs.firmware.outputs.checkpoint != ''
    uses: ./.github/workflows/verify-candidate.yml
    with:
      checkpoint_tag: ${{ needs.firmware.outputs.checkpoint }}
      candidate_release: ${{ needs.firmware.outputs.candidate }}
      source_ref: ${{ github.sha }}
    secrets: inherit
